# =============================================================================
# 08-producers.yaml - Python Kafka Producers Deployment
# OVERRIDE #1: Uses INTERNAL listener (kafka:29092) for cluster communication
# OVERRIDE #3: imagePullPolicy: Never for local images
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-producers
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: producers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueba-pipeline
      component: producers
  template:
    metadata:
      labels:
        app: ueba-pipeline
        component: producers
    spec:
      initContainers:
        # Wait for Kafka topics to be ready
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.4.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka topics to be created..."
              until kafka-topics --bootstrap-server kafka:29092 --list | grep -q "wazuh_alerts"; do
                echo "Topics not ready yet, retrying in 5 seconds..."
                sleep 5
              done
              echo "Kafka topics are ready!"
      containers:
        - name: producers
          # OVERRIDE #3: Local image - imagePullPolicy: Never
          image: gp-project-kafka:latest
          imagePullPolicy: Never
          env:
            # OVERRIDE #1: Using INTERNAL listener for Kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
