# =============================================================================
# 03-zookeeper.yaml - Zookeeper StatefulSet with Persistent Storage
# OVERRIDE #2: PersistentVolumeClaim for data and logs (2Gi)
# =============================================================================

---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: zookeeper
spec:
  clusterIP: None
  selector:
    app: ueba-pipeline
    component: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: follower
      port: 2888
      targetPort: 2888
    - name: election
      port: 3888
      targetPort: 3888

---
# ClusterIP Service for internal access
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: zookeeper
spec:
  type: ClusterIP
  selector:
    app: ueba-pipeline
    component: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181

---
# Zookeeper StatefulSet with PVC (OVERRIDE #2)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 1
  selector:
    matchLabels:
      app: ueba-pipeline
      component: zookeeper
  template:
    metadata:
      labels:
        app: ueba-pipeline
        component: zookeeper
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /var/lib/zookeeper/data /var/lib/zookeeper/log
              chmod -R 755 /var/lib/zookeeper/data /var/lib/zookeeper/log
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          securityContext:
            runAsUser: 0
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.0
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: follower
            - containerPort: 3888
              name: election
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_DATA_DIR
              value: /var/lib/zookeeper/data
            - name: ZOOKEEPER_DATA_LOG_DIR
              value: /var/lib/zookeeper/log
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
        labels:
          app: ueba-pipeline
          component: zookeeper
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: zookeeper-log
        labels:
          app: ueba-pipeline
          component: zookeeper
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
