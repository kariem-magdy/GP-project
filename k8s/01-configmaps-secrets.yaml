# =============================================================================
# 01-configmaps-secrets.yaml - Configuration and Secrets
# =============================================================================

---
# PostgreSQL ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: ueba-db-config
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: postgres
data:
  host: "postgres"
  port: "5432"
  database: "ueba"

---
# PostgreSQL Init Script ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: postgres
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS user_features (
        userId VARCHAR(255) NOT NULL,
        windowEnd TIMESTAMP NOT NULL,
        
        -- Auth
        login_fail_rate DOUBLE PRECISION,
        distinct_ip_count INT,
        
        -- Network
        api_request_count BIGINT,
        http_4xx_rate DOUBLE PRECISION,
        data_out_bytes BIGINT,
        api_path_entropy DOUBLE PRECISION,
        
        -- Security
        high_sev_alert_count BIGINT,
        avg_wazuh_level DOUBLE PRECISION,
        
        -- System
        avg_cpu_usage DOUBLE PRECISION,

        -- AI / DDoS detection (consumed by ML pipeline)
        total_event_count INT DEFAULT 0,
        limit_exceeded BOOLEAN DEFAULT FALSE,
        aggregate_vector FLOAT8[] DEFAULT '{}',
        raw_event_sequence TEXT[] DEFAULT '{}',

        PRIMARY KEY (userId, windowEnd)
    );

    -- Trigger function to notify the ML model
    CREATE OR REPLACE FUNCTION notify_model_trigger() RETURNS TRIGGER AS $$
    DECLARE
        payload TEXT;
    BEGIN
        payload := json_build_object(
            'userId', NEW.userId,
            'windowEnd', NEW.windowEnd
        )::text;
        PERFORM pg_notify('model_trigger', payload);
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS on_feature_insert ON user_features;
    CREATE TRIGGER on_feature_insert
    AFTER INSERT OR UPDATE ON user_features
    FOR EACH ROW EXECUTE FUNCTION notify_model_trigger();

---
# Kafka ConfigMap (OVERRIDE #1: Dual-Listener configuration)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: kafka
data:
  # Internal listener for cluster communication (used by Flink, producers, init-kafka)
  bootstrap-servers-internal: "kafka:29092"
  # External listener for local tools (Offset Explorer on Windows host)
  bootstrap-servers-external: "localhost:9092"

---
# PostgreSQL Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: ueba-db-credentials
  namespace: ueba
  labels:
    app: ueba-pipeline
    component: postgres
type: Opaque
stringData:
  username: flink
  password: flink
